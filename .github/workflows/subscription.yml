name: Subscription compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Unit tests, build, and vet
        run: |
          go test ./util ./testing/util
          go build ./...
          go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare official Mihomo and rule data
        run: |
          python -m pip install PyYAML==6.0.3
          mkdir -p "$RUNNER_TEMP/mihomo-check"
          curl --fail --location --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo "ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          go run ./cmd/verify-clash-profile > "$RUNNER_TEMP/mihomo-check/verge.yaml"
          python - <<'PY'
          import os, pathlib, urllib.request, yaml
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mihomo-check'
          config = yaml.safe_load((root / 'verge.yaml').read_text())
          for provider in config['rule-providers'].values():
              path = root / provider['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(urllib.request.urlopen(provider['url'], timeout=60).read())
          PY
      - name: Actual Mihomo parser and routing tests
        run: |
          "$RUNNER_TEMP/mihomo" -t -d "$RUNNER_TEMP/mihomo-check" -f "$RUNNER_TEMP/mihomo-check/verge.yaml"
          python scripts/test-clash-verge-routing.py "$RUNNER_TEMP/mihomo" "$RUNNER_TEMP/mihomo-check/verge.yaml" "$RUNNER_TEMP/mihomo-check"
